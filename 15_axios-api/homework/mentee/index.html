<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Axios — Weather Dashboard</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <!--
  ============================================================
  🌤️  WEATHER DASHBOARD  (axios version)
  ============================================================
  Same project as the fetch homework — same HTML, same CSS,
  same DOM. Only app.js and debug.js changed tools.

  ⚠️ SCRIPT ORDER MATTERS: the axios CDN script loads BEFORE
  app.js at the bottom of this file. Swap them and you get
  "axios is not defined".
  ============================================================
  -->

  <body>

    <header class="site-header">
      <div class="header-left">
        <h1>🌤️ Weather Dashboard</h1>
        <span class="api-badge">Open-Meteo API</span>
        <span class="tool-badge">⚡ axios</span>
      </div>
    </header>

    <!-- Add city form -->
    <div class="controls-bar">
      <select id="city-select">
        <option value="">Select a city...</option>
        <option value="new-york">New York</option>
        <option value="london">London</option>
        <option value="tokyo">Tokyo</option>
        <option value="sydney">Sydney</option>
        <option value="paris">Paris</option>
        <option value="dubai">Dubai</option>
      </select>
      <button id="fetch-weather-btn" class="btn-primary">Get Weather</button>
      <button id="fetch-all-btn" class="btn-secondary">Fetch All Cities</button>
      <button id="clear-btn" class="btn-danger">Clear All</button>
    </div>

    <!-- Status bar -->
    <div id="status-bar" class="status-bar hidden">
      <span id="status-message"></span>
    </div>

    <!-- Loading spinner -->
    <div id="loading-spinner" class="spinner hidden">
      <div class="spin"></div>
      <p id="loading-message">Fetching weather...</p>
    </div>

    <!-- Error box -->
    <div id="error-box" class="error-box hidden">
      <p id="error-message">Something went wrong.</p>
    </div>

    <!-- Weather cards grid — JS renders here -->
    <main id="weather-grid" class="weather-grid"></main>

    <!-- ⚠️ ORDER MATTERS: axios must load BEFORE app.js -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
